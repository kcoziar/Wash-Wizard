kind = "mobile"
previewPath = "/"
title = "Pressure Washing Calculator+"
description = "A premium iPhone app for solo pressure washing operators doing driveways, walkways, patios and stairs. It turns known areas, dimensions, flat or hourly pricing and pasted customer requests into an organized whole-visit quote, remembers personal rates and visit setups, checks travel/setup/cleanup and owner earnings privately, and produces clean customer PDF and text quotes. Local-first and offline-capable, with three complete quotes free and a RevenueCat-powered Pro subscription."
version = "1.0.0"
id = "artifacts/pressure-quote"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21202

[services.development]
run = "pnpm --filter @workspace/pressure-quote run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pressure-quote", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pressure-quote", "run", "serve" ]

[services.env]
PORT = "21202"
BASE_PATH = "/"
