openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: telemetry
    description: Anonymous product events and scrubbed crash reports from the iPhone app
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /telemetry/events:
    post:
      operationId: recordEvent
      tags: [telemetry]
      summary: Record one anonymous product event
      description: Only an event name from a fixed list and, for the paywall, where it was opened from. No identifiers, no customer content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryEvent"
      responses:
        "204":
          description: Recorded
        "400":
          description: Not an accepted event
  /telemetry/crashes:
    post:
      operationId: recordCrash
      tags: [telemetry]
      summary: Record one scrubbed crash report
      description: The app area and the error type only. Never the error message, stack or customer content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryCrash"
      responses:
        "204":
          description: Recorded
        "400":
          description: Not an accepted report
components:
  schemas:
    TelemetryEvent:
      type: object
      additionalProperties: false
      properties:
        event:
          type: string
          enum: [setup_finished, setup_skipped, quote_created_1, quote_created_2, quote_created_3, paste_used, text_send_used, paywall_viewed, purchase, restore]
        from:
          type: string
          enum: [first, limit, last-free, settings, home, card, other]
        appVersion:
          type: string
          pattern: "^[0-9]{1,3}\\.[0-9]{1,3}(\\.[0-9]{1,3})?$"
        platform:
          type: string
          enum: [ios, android, web]
      required: [event, appVersion, platform]
    TelemetryCrash:
      type: object
      additionalProperties: false
      properties:
        area:
          type: string
          enum: [render, pdf, share, storage, purchase]
        errorType:
          type: string
          description: The error's class name, such as TypeError. Letters only.
          pattern: "^[A-Za-z]{1,40}$"
        appVersion:
          type: string
          pattern: "^[0-9]{1,3}\\.[0-9]{1,3}(\\.[0-9]{1,3})?$"
        platform:
          type: string
          enum: [ios, android, web]
      required: [area, errorType, appVersion, platform]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

